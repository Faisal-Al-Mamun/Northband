# Dev stack. First API build downloads torch/faster-whisper (several minutes, CPU, no GPU).
# HuggingFace models persist in the hfcache volume so STT/TTS do not re-download.
# Happy path: cp .env.example .env && docker compose up --build
# Helpers: ./scripts/dev.sh (macOS/Linux) or .\scripts\dev.ps1 (Windows)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: northband
      POSTGRES_PASSWORD: northband
      POSTGRES_DB: northband
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northband"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://northband:northband@postgres:5432/northband
      DATABASE_URL_SYNC: postgresql+psycopg://northband:northband@postgres:5432/northband
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      # Docker Desktop bind mounts often miss inotify on macOS and Windows
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
      - hfcache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://northband:northband@postgres:5432/northband
      DATABASE_URL_SYNC: postgresql+psycopg://northband:northband@postgres:5432/northband
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
      - hfcache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  pgdata:
  uploads:
  hfcache:
